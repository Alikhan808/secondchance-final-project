name: User stories and landing page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
jobs:
  setup:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Create eight labeled user stories
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            for (const name of ['new','icebox','technical debt','backlog']) {
              try { await github.rest.issues.createLabel({...repo,name,color:'217A68'}); }
              catch(e) { if(e.status!==422) throw e; }
            }
            const stories = [
              ['Browse donated items','visitor','browse available items','find useful household goods','backlog'],
              ['View item details','visitor','view an item description and condition','decide whether it suits my needs','backlog'],
              ['Search items by category','visitor','filter items by category','quickly find relevant donations','new'],
              ['Register an account','new user','register securely','participate in the community','new'],
              ['Log in securely','registered user','log in using my credentials','access my profile','new'],
              ['Publish an item with a photo','donor','upload an item and a photo','give it a second chance','backlog'],
              ['Update my profile','registered user','edit my profile information','keep my details current','icebox'],
              ['Automate backend checks','maintainer','run repeatable API checks in CI','detect regressions early','technical debt']
            ];
            const existing=await github.paginate(github.rest.issues.listForRepo,{...repo,state:'all'});
            for(const [title,role,need,benefit,label] of stories) {
              if(existing.some(issue=>issue.title===title)) continue;
              const body=`**As a** ${role}\n**I need** to ${need}\n**So that** I can ${benefit}.\n\n### Details and assumptions\nThe SecondChance frontend uses the Express REST API and MongoDB.\n\n### Acceptance criteria\n\`\`\`gherkin\nGiven the application is running and valid input is provided\nWhen I ${need}\nThen the requested operation succeeds and the result is shown\nAnd invalid input receives a clear error response\n\`\`\``;
              await github.rest.issues.create({...repo,title,body,labels:[label]});
            }
      - name: Prepare project landing page
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SecondChance — Give things a new beginning</title>
          <style>body{margin:0;background:#f4f7f3;color:#183d33;font:18px/1.6 system-ui,sans-serif}header,main,footer{max-width:1000px;margin:auto;padding:32px}header{font-size:24px;font-weight:700;border-bottom:1px solid #d5dfd7}main{padding-top:80px}h1{font-size:clamp(44px,7vw,78px);line-height:1.08;max-width:850px;margin:20px 0 30px}p{max-width:650px}.button{display:inline-block;background:#216850;color:white;padding:15px 28px;border-radius:8px;text-decoration:none;font-weight:700;margin:15px 0 50px}.steps{display:flex;gap:24px;flex-wrap:wrap}.steps section{background:white;border:1px solid #dce6dd;padding:22px;border-radius:10px;flex:1;min-width:180px}footer{font-size:14px;color:#537266}</style></head>
          <body><header>SecondChance</header><main><p>GIVE • REUSE • RECYCLE</p><h1>Useful things deserve a second chance.</h1><p>Connect with people giving away household items. Find something you need, reduce waste, and help your community reuse more.</p><a class="button" href="#how-it-works">Get Started</a><div class="steps" id="how-it-works"><section><h2>Find</h2><p>Browse items and search by category.</p></section><section><h2>Share</h2><p>Give away household items you no longer need.</p></section><section><h2>Reuse</h2><p>Help useful things find a new home.</p></section></div><p><a href="https://github.com/Alikhan808/secondchance-final-project">View project and API documentation</a></p></main><footer>SecondChance · IBM JavaScript Back-end Capstone · Project landing page. Backend API demonstrations run in GitHub Actions.</footer></body></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy landing page
        id: deployment
        uses: actions/deploy-pages@v4
